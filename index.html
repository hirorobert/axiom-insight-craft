<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Icons generated from the approved logo (brand/source/CFOClose_logo.png) by scripts/brand/generateBrandAssets.mjs. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0D1D3B" />
    <title>CFOClose — Trial balance review software</title>
    <meta name="description" content="Import a trial balance, run the checks and record a classification decision for every account. Subscriptions are activated by our team; financial reporting is a pilot by invitation." />
    <meta name="author" content="CFOClose" />
    <!-- No static canonical: each route sets its own on https://cfoclose.com (src/components/seo/RouteMeta.tsx). -->

    <meta property="og:site_name" content="CFOClose" />
    <meta property="og:title" content="CFOClose — Trial balance review software" />
    <meta property="og:description" content="Import a trial balance, run the checks and record a classification decision for every account. Subscriptions are activated by our team; financial reporting is a pilot by invitation." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cfoclose.com/" />
    <meta property="og:image" content="https://cfoclose.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CFOClose" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CFOClose — Trial balance review software" />
    <meta name="twitter:description" content="Import a trial balance, run the checks and record a classification decision for every account. Subscriptions are activated by our team; financial reporting is a pilot by invitation." />
    <meta name="twitter:image" content="https://cfoclose.com/og-image.png" />

    <!--
      JSON-LD: factual fields only, per src/content/publicClaimRegistry.ts's discipline.
      Deliberately NO "offers"/price field, and none may be added: the commercial structure shown
      on the landing page is explicitly PROPOSED and under enforcement verification (entity and
      named-user capacity are not system-enforced, self-serve payment is off), so emitting an
      Offer here would assert a purchasable price that does not exist. No aggregateRating either:
      no genuine eligible reviews exist. Asserted by
      src/content/landing/__tests__/faqStructuredData.test.ts.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CFOClose",
        "url": "https://cfoclose.com/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CFOClose",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "url": "https://cfoclose.com/",
        "description": "Upload, check and review the accounts in your trial balance, with traceable checks and attributable user decisions."
      }
    </script>
    <!--
      FAQPage: generated from src/content/landing/landingContent.ts's LANDING_FAQ, the same data
      the visible FAQ renders from. Served with the document rather than injected after load, so a
      crawler never depends on client JavaScript. Byte parity with
      serializeFaqStructuredData() is asserted by faqStructuredData.test.ts — edit LANDING_FAQ and
      regenerate, never this block by hand.
    -->
    <script type="application/ld+json" data-faq-structured-data>
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What does CFOCLOSE do today?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "CFOCLOSE checks an imported trial balance and holds the accounts that need a classification decision for review, until it is a reviewed trial balance ready for statement preparation. A reviewed trial balance is not reconciled to supporting evidence, audited or approved. It is a preparation and review workspace: the professional using it remains responsible for the conclusions reached."
            }
          },
          {
            "@type": "Question",
            "name": "How is a subscription activated?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Choose a plan. Where online payment is open for it, pay by card on the secure page of our merchant of record; the plan starts when the payment is verified, not when you return from the payment page. Otherwise send an activation request naming the plan: we reply by email to agree terms, then activate it on your CFOCLOSE account; nothing is activated by sending a request."
            }
          },
          {
            "@type": "Question",
            "name": "Are forecasting, budgeting and the other specialist services part of the software?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Forecasting, budgeting, financial analysis, accounting policies and close support are delivered by people and quoted separately. They are not features of the software and are not included in any plan."
            }
          },
          {
            "@type": "Question",
            "name": "Which reporting frameworks can be selected?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A workspace records its reporting framework: IFRS for SMEs, IFRS, IPSAS accrual or IPSAS cash. Recording a framework does not generate statements. Financial reporting for IFRS for SMEs is a pilot by invitation and is not generally available."
            }
          },
          {
            "@type": "Question",
            "name": "Does CFOCLOSE replace professional judgement?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Classification suggestions are graded, and accounts the workspace cannot resolve confidently are held as exceptions for a recorded decision. Checks report what they find rather than concluding that the accounts are correct. The professional preparing or reviewing the work remains responsible for it."
            }
          },
          {
            "@type": "Question",
            "name": "How are preparation decisions attributed?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Review decisions are associated with the authenticated user account that recorded them. CFOCLOSE does not replace an organization's responsibility to define its own approval and professional-review policies."
            }
          },
          {
            "@type": "Question",
            "name": "What happens to supported historical outputs after a subscription lapses?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Supported historical outputs remain readable under the defined lifecycle and subscription rules, so work already prepared does not disappear when a paid capacity ends. Preparing new work depends on the capacity then in force."
            }
          },
          {
            "@type": "Question",
            "name": "Which import formats are currently available?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Trial balances import from CSV and XLSX. Checks and review decisions are shown in the workspace."
            }
          },
          {
            "@type": "Question",
            "name": "Is the displayed pricing final?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Amounts marked Proposed are not final; they are confirmed with you before the plan is activated. An amount shown without that mark is what a 12-month term costs. Any sales tax added to a card payment is shown before you pay."
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
