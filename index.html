    <!--
      JSON-LD: factual fields only, per src/content/publicClaimRegistry.ts's discipline.
      Deliberately NO "offers"/price field: checkout is real and server-authoritative
      (src/components/commercial/CheckoutUpgradeButton.tsx) but this static file cannot verify
      whether it is live-enabled in the current deployment (platform_state may be
      PAYMENTS_DISABLED) — asserting a purchasable Offer here would risk exactly the
      "Offer/pricing data... unless the displayed price is current and purchasable" violation
      this file is required to avoid. No aggregateRating: no genuine eligible reviews exist.
    -->
