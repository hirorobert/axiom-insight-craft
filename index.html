    <!--
      JSON-LD: factual fields only, per src/content/publicClaimRegistry.ts's discipline.
      Deliberately NO "offers"/price field, and none may be added: the commercial structure shown
      on the landing page is explicitly PROPOSED and under enforcement verification (entity and
      named-user capacity are not system-enforced, self-serve payment is off), so emitting an
      Offer here would assert a purchasable price that does not exist. No aggregateRating either:
      no genuine eligible reviews exist. Asserted by
      src/content/landing/__tests__/faqStructuredData.test.ts.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CFOClose",
        "url": "https://cfoclose.com/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CFOClose",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "url": "https://cfoclose.com/",
        "description": "Import a trial balance, review classification exceptions and prepare framework-aware financial statements with traceable checks and attributable user decisions."
      }
    </script>
    <!--
      FAQPage: generated from src/content/landing/landingContent.ts's LANDING_FAQ, the same data
      the visible FAQ renders from. Served with the document rather than injected after load, so a
      crawler never depends on client JavaScript. Byte parity with
      serializeFaqStructuredData() is asserted by faqStructuredData.test.ts — edit LANDING_FAQ and
      regenerate, never this block by hand.
    -->
    <script type="application/ld+json" data-faq-structured-data>
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What does CFOCLOSE help prepare?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "CFOCLOSE takes an imported trial balance through classification review and preparation checks, then prepares framework-aware financial statements and supporting schedules for review. It is a preparation and review workspace: the professional using it remains responsible for the conclusions reached and for anything filed outside the workspace."
            }
          },
          {
            "@type": "Question",
            "name": "Which reporting frameworks can be selected?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A workspace can be set to IFRS for SMEs, IFRS, IPSAS accrual or IPSAS cash. The selected framework governs how prepared statements are presented and which preparation checks apply. Jurisdiction-specific tax capabilities appear only in a workspace where that jurisdiction has been configured."
            }
          },
          {
            "@type": "Question",
            "name": "Does CFOCLOSE replace professional judgement?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Classification suggestions are graded, and accounts the workspace cannot resolve confidently are held as exceptions for a recorded decision. Preparation checks report what they find rather than concluding that a set of statements is correct. The professional preparing or reviewing the work remains responsible for it."
            }
          },
          {
            "@type": "Question",
            "name": "How are preparation decisions attributed?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Review decisions are associated with the authenticated user account that recorded them. CFOCLOSE does not replace an organization's responsibility to define its own approval and professional-review policies."
            }
          },
          {
            "@type": "Question",
            "name": "What happens to supported historical outputs after a subscription lapses?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Supported historical outputs remain readable under the defined lifecycle and subscription rules, so work already prepared does not disappear when a paid capacity ends. Preparing new outputs and exporting again depend on the capacity then in force."
            }
          },
          {
            "@type": "Question",
            "name": "Which import and export formats are currently available?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Trial balances import from CSV and XLSX. Prepared outputs are viewed in the workspace and exported as XLSX, PDF, CSV and structured JSON. Structured regulatory filing formats are not part of this preview."
            }
          },
          {
            "@type": "Question",
            "name": "What is Close Certification?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Close Certification records that a reviewed trial balance has passed the required preparation checks and that its outstanding classification decisions were resolved. It is an internal preparation record kept inside the workspace. It is not an external audit, an audit opinion, or any form of statutory assurance."
            }
          },
          {
            "@type": "Question",
            "name": "Is the displayed pricing already available?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The plan structure shown is proposed and is undergoing final enforcement verification. Self-serve payment is switched off: there is no online checkout, plans are activated by our team, and nothing on this page can be purchased. Treat it as a preview, not a commercial offer."
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
