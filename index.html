<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CFOClose — Trial Balance Review Workspace</title>
    <meta name="description" content="Upload, check and review the accounts in your trial balance, and reconcile it to supporting evidence, with traceable checks and attributable user decisions." />
    <meta name="author" content="CFOClose" />
    <meta name="keywords" content="CFOClose, trial balance review, trial balance checks, account classification review, supporting-evidence reconciliation" />
    <link rel="canonical" href="https://cfoclose.com/" />

    <meta property="og:title" content="CFOClose — Trial Balance Review Workspace" />
    <meta property="og:description" content="Upload, check and review the accounts in your trial balance, and reconcile it to supporting evidence, with traceable checks and attributable user decisions." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cfoclose.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CFOClose — Trial Balance Review Workspace" />
    <meta name="twitter:description" content="Upload, check and review the accounts in your trial balance, and reconcile it to supporting evidence, with traceable checks and attributable user decisions." />

    <!--
      JSON-LD: factual fields only, per src/content/publicClaimRegistry.ts's discipline.
      Deliberately NO "offers"/price field, and none may be added: the commercial structure shown
      on the landing page is explicitly PROPOSED and under enforcement verification (entity and
      named-user capacity are not system-enforced, self-serve payment is off), so emitting an
      Offer here would assert a purchasable price that does not exist. No aggregateRating either:
      no genuine eligible reviews exist. Asserted by
      src/content/landing/__tests__/faqStructuredData.test.ts.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CFOClose",
        "url": "https://cfoclose.com/"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CFOClose",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "url": "https://cfoclose.com/",
        "description": "Upload, check and review the accounts in your trial balance, and reconcile it to supporting evidence, with traceable checks and attributable user decisions."
      }
    </script>
    <!--
      FAQPage: generated from src/content/landing/landingContent.ts's LANDING_FAQ, the same data
      the visible FAQ renders from. Served with the document rather than injected after load, so a
      crawler never depends on client JavaScript. Byte parity with
      serializeFaqStructuredData() is asserted by faqStructuredData.test.ts — edit LANDING_FAQ and
      regenerate, never this block by hand.
    -->
    <script type="application/ld+json" data-faq-structured-data>
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What does CFOCLOSE do today?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "CFOCLOSE checks an imported trial balance, holds the accounts that need a decision for review, and reconciles the trial balance to supporting evidence such as bank statements, mobile-money exports or subledgers. It is a preparation and review workspace: the professional using it remains responsible for the conclusions reached."
            }
          },
          {
            "@type": "Question",
            "name": "Which reporting frameworks can be selected?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A workspace records its reporting framework: IFRS for SMEs, IFRS, IPSAS accrual or IPSAS cash."
            }
          },
          {
            "@type": "Question",
            "name": "Does CFOCLOSE replace professional judgement?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Classification suggestions are graded, and accounts the workspace cannot resolve confidently are held as exceptions for a recorded decision. Checks report what they find rather than concluding that the accounts are correct. The professional preparing or reviewing the work remains responsible for it."
            }
          },
          {
            "@type": "Question",
            "name": "How are preparation decisions attributed?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Review decisions are associated with the authenticated user account that recorded them. CFOCLOSE does not replace an organization's responsibility to define its own approval and professional-review policies."
            }
          },
          {
            "@type": "Question",
            "name": "What happens to supported historical outputs after a subscription lapses?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Supported historical outputs remain readable under the defined lifecycle and subscription rules, so work already prepared does not disappear when a paid capacity ends. Preparing new work depends on the capacity then in force."
            }
          },
          {
            "@type": "Question",
            "name": "Which import formats are currently available?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Trial balances import from CSV and XLSX. Checks, review decisions and evidence reconciliation are shown in the workspace."
            }
          },
          {
            "@type": "Question",
            "name": "Is the displayed pricing already available?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. The plan structure shown is proposed and is undergoing final enforcement verification. Self-serve payment is switched off: there is no online checkout, plans are activated by our team, and nothing on this page can be purchased. Treat it as a preview, not a commercial offer."
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
