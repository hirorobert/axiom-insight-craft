name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual runs only: the write-capable staging RLS regression is reachable ONLY through this trigger.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request whose head must equal the tested commit (browser acceptance fails otherwise)"
        required: false
        type: string

jobs:
  migration-audit:
    name: Supabase Migration Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run migration auditor (strict)
        run: |
          set -o pipefail
          node scripts/audit_migrations.mjs --strict | tee audit.log
          if ! grep -q '^VERDICT: CLEAN$' audit.log; then
            echo "::error::Migration audit did not report CLEAN."
            exit 1
          fi

  conflict-marker-check:
    name: Merge Conflict Marker Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for merge conflict markers
        run: |
          set -e
          # Search tracked files for conflict markers. Exclude this workflow file itself.
          # Patterns anchored at line start to avoid false positives in prose.
          if git grep -n -I -E '^(<{7}|={7}|>{7})( |$)' -- ':!.github/workflows/ci.yml'; then
            echo "::error::Merge conflict markers detected. Resolve before merging."
            exit 1
          fi
          echo "No merge conflict markers found."

  lint-build-and-typecheck:
    name: Lint, Build and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Type check
        run: bunx tsc --noEmit -p tsconfig.app.json

  release-gate:
    name: Release Gate (clean Linux, frozen lockfile, full suite)
    runs-on: ubuntu-latest
    # The deterministic acceptance gate: exact head of the pull request, dependencies from the committed lockfile,
    # LF line endings (.gitattributes), zero failing tests — there is no "baseline failure" allowance.
    # The database-inertness guard compares HEAD against GitHub's exact base, never an assumed branch
    # (scripts/ci/inertBase.mjs): the pull request's base SHA, or the push's "before" SHA. It fails closed without one.
    env:
      DB_INERT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
      DB_INERT_BASE_SOURCE: ${{ github.event_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # bun.lock is the ONLY lockfile (packageManager: bun@1.3.14 in package.json); scripts/ci/assertSingleLockfile.mjs guards it.
      - name: Install dependencies from the committed lockfile (frozen)
        run: bun install --frozen-lockfile

      - name: Jurisdiction audits (copy audit + import boundary)
        run: bunx vitest run src/lib/jurisdiction

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Inert framework-kernel contract (typecheck and source-boundary inventory; no hosted access)
        run: |
          bunx tsc --noEmit -p release/candidates/framework-kernel-r1/tsconfig.json
          node release/candidates/framework-kernel-r1/inventory.mjs --check
          bunx tsc --noEmit -p release/candidates/ipsas-accrual-r1/tsconfig.json

      - name: Package-manager authority (one lockfile, pinned Bun, no competing installer)
        run: |
          node scripts/ci/assertSingleLockfile.mjs
          node scripts/buildStatementCompiler.mjs --check

      - name: Migration authority (the hosted Drizzle apply journal mirrors the authored supabase/migrations exactly)
        run: node scripts/ci/assertMigrationAuthority.mjs

      - name: Database-inertness guard against the exact base (must execute with zero skipped)
        run: |
          bunx vitest run src/lib/financialStatementsWorkspace/databaseInert.test.ts src/lib/__tests__/inertBase.test.ts --reporter=verbose --reporter=json --outputFile.json=inert-report.json
          node scripts/ci/assertTestsExecuted.mjs inert-report.json src/lib/financialStatementsWorkspace/databaseInert.test.ts src/lib/__tests__/inertBase.test.ts

      - name: Full test suite
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: synthetic-unit-test-key
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/unitNetworkGuard.cjs
        run: bun run test

      - name: Local OCR smoke (synthetic image, locked local model, no API)
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/unitNetworkGuard.cjs
        run: node scripts/preparation/ocrSmoke.mjs

      - name: Build
        run: bun run build

      - name: Exact bundled OCR runtime assets
        run: node scripts/preparation/assertOcrAssets.mjs

      - name: Jurisdiction pack isolation (the pack is a separate lazy chunk; entry chunks carry no statutory wording)
        run: node scripts/ci/assertPackIsolation.mjs dist

      - name: Public search identity (the production build's icons, social image, manifest, per-route canonicals and sitemap on https://cfoclose.com)
        run: node scripts/ci/assertPublicMetadata.mjs dist

      - name: Public search identity in the browser (the production build served on loopback; each route's title, single canonical on https://cfoclose.com, robots, in headless Chrome)
        run: node scripts/ci/routeMetadataInBrowser.mjs dist

      - name: Production bundle isolation (the bundle guard re-run against the build; the full suite above runs before dist exists, where it skips)
        run: bunx vitest run src/lib/financialStatementsWorkspace/harnessIsolation.test.ts
      - name: Development gallery excluded from the production bundle
        run: node scripts/ci/assertDevGalleryExcluded.mjs dist

  edge-function-checks:
    name: Edge function checks (Deno, process-trial-balance)
    runs-on: ubuntu-latest
    # Read-only: type-checks the trial-balance ingestion core and runs the REAL process-trial-balance handler end to end
    # with only its network edges (Supabase client, std serve) replaced by in-memory doubles. No secrets, no deploy.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Type-check the complete process-trial-balance function against the real Supabase client types
        run: deno check supabase/functions/process-trial-balance/index.ts

      - name: Type-check the complete trial-balance-layout function (authentication imports included) against the real Supabase client types
        run: deno check supabase/functions/trial-balance-layout/index.ts

      - name: Type-check the complete layout-assist function (I1-C; no provider wired) against the real Supabase client types
        run: deno check supabase/functions/layout-assist/index.ts

      - name: Type-check the complete trial-balance-draft function (Phase 2 P2-2 drafts; sign, commit and cancel) against the real Supabase client types
        run: deno check supabase/functions/trial-balance-draft/index.ts

      - name: Type-check the independent statement compiler against the real Supabase client types
        run: deno check supabase/functions/compile-financial-report/index.ts

      - name: Upload policy probe in Deno under a 150 MB V8 heap cap (invented files; the real gate and reader; each case in its own process, fits or terminated, measured)
        run: deno run --allow-read --allow-write --allow-run --allow-env --allow-net=esm.sh scripts/bench/tbUploadPolicyDenoProbe.ts 150

      - name: Type-check the online payment functions (checkout, recovery, provider diagnostics and the Polar and Snippe webhooks) against the real Supabase client types
        run: deno check supabase/functions/commercial-create-checkout/index.ts supabase/functions/commercial-payment-status/index.ts supabase/functions/commercial-provider-diagnostics/index.ts supabase/functions/commercial-webhook-polar/index.ts supabase/functions/commercial-webhook-snippe/index.ts supabase/functions/commercial-payment-webhook/index.ts

      - name: Type-check the ingestion core and the function-path test
        run: deno check --import-map=supabase/functions/process-trial-balance/functionpath/import_map.json supabase/functions/_shared/tbIngestion.ts supabase/functions/_shared/tbSource.ts supabase/functions/_shared/layoutProfile.ts supabase/functions/process-trial-balance/functionpath/functionPath.test.ts

      - name: Function-path tests (real handler, in-memory database double)
        run: deno test --no-check --allow-env --allow-net=esm.sh,deno.land --import-map=supabase/functions/process-trial-balance/functionpath/import_map.json supabase/functions/process-trial-balance/functionpath/functionPath.test.ts

      - name: Existing process-trial-balance Deno tests
        run: deno test --allow-env --allow-read --allow-net=esm.sh,deno.land supabase/functions/process-trial-balance/balanceSheetCheck_test.ts supabase/functions/process-trial-balance/l5l6Evidence.test.ts supabase/functions/process-trial-balance/normalize.test.ts supabase/functions/process-trial-balance/publicSectorClassification_test.ts supabase/functions/process-trial-balance/requestIdentity.test.ts supabase/functions/process-trial-balance/tierProvenance.test.ts supabase/functions/_shared/pagedSelect.test.ts

  golden-tests:
    name: Golden Fixture Tests (vitest)
    runs-on: ubuntu-latest
    # Run in parallel with lint-build — tests don't depend on build output
    needs: []
    # The database-inertness guard compares HEAD against GitHub's exact base, never an assumed branch
    # (scripts/ci/inertBase.mjs): the pull request's base SHA, or the push's "before" SHA. It fails closed without one.
    env:
      DB_INERT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
      DB_INERT_BASE_SOURCE: ${{ github.event_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Database-inertness guard against the exact base (must execute with zero skipped)
        run: |
          bunx vitest run src/lib/financialStatementsWorkspace/databaseInert.test.ts src/lib/__tests__/inertBase.test.ts --reporter=verbose --reporter=json --outputFile.json=inert-report.json
          node scripts/ci/assertTestsExecuted.mjs inert-report.json src/lib/financialStatementsWorkspace/databaseInert.test.ts src/lib/__tests__/inertBase.test.ts

      - name: Run golden fixture tests
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: synthetic-unit-test-key
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci/unitNetworkGuard.cjs
        run: bun run test
        # Tests cover: computeComplianceScore (pure scoring engine, all grade boundaries,
        # 5 factors, 6 FA2026 fixtures) + computeWearTear (ITA s.34 all 7 classes).
        # These are pure-function tests — no DB, no network, no mocks except supabase client.

  reconciliation-function-checks:
    name: Edge function checks (Deno, reconciliation result and resolution)
    runs-on: ubuntu-latest
    # Read-only: type-checks the two reconciliation functions that record results through the service-role RPCs. No secrets, no deploy.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Type-check safisha-match, safisha-resolve and safisha-ingest against the real Supabase client types
        run: deno check supabase/functions/safisha-match/index.ts supabase/functions/safisha-resolve/index.ts supabase/functions/safisha-ingest/index.ts

  rls-regression:
    name: Staging RLS Regression (manual, write-capable)
    # WRITE-CAPABLE: this suite creates users, companies and rows in the Supabase project it
    # targets. It must never run automatically, so it is reachable ONLY through a manual
    # workflow_dispatch, never from pull_request or push.
    #
    # It also requires the protected `staging` GitHub environment. Configure that environment
    # (repository settings) with: required reviewers, deployment branches limited to `main`, the
    # secrets STAGING_SUPABASE_URL / STAGING_SUPABASE_ANON_KEY / STAGING_SUPABASE_SERVICE_ROLE_KEY,
    # and the variable STAGING_SUPABASE_PROJECT_REF (the explicit expected staging project
    # reference). Until that variable exists the guard below fails closed and nothing runs.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    concurrency:
      group: rls-regression-staging
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Fail-closed guard. Runs BEFORE dependencies are installed and before any client exists.
      # Secrets are scoped to the steps that need them (never job-level) and are never printed.
      - name: Verify the target is the expected staging project (never production)
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/stagingGuard.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run RLS regression suite against staging
        # The suite re-runs the same guard itself before creating any client.
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: bun run test:rls

      - name: Upload lifecycle proof against staging (PR #32: real Auth, PostgREST, RLS and Storage)
        # Same guard, same STAGING_* variables only; refuses production by construction.
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/upload_lifecycle_staging.mjs

      - name: Source sweeper readiness on staging (PR #32; fail-closed)
        # Same guard, same STAGING_* variables only. NOT READY unless deployed, configured for this project,
        # scheduled and answering a single-use ticket (the lifecycle proof above configures the staging URL).
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/sweeper_readiness.mjs

      - name: Staging browser acceptance (PR #32; real frontend, headless Chrome, disposable identities)
        # Same guard, same STAGING_* variables only. Builds the frontend with NO .env readable and verifies the bundle
        # names staging and never production; fails on any failed journey, any production request, a forbidden stage,
        # a cleanup failure, missing screenshots, or a tested commit that is not the requested PR head.
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ARTIFACT_DIR: artifacts/browser-acceptance
        run: node scripts/browser_acceptance.mjs

      - name: Upload browser acceptance screenshots for human review
        # Runs after a failed suite too (never after a cancel), so failures can be reviewed. No secrets, no env; it
        # uploads only the screenshots, results.json and cleanup.json the suite wrote. The job still fails.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-${{ github.sha }}
          path: artifacts/browser-acceptance
          if-no-files-found: error
          retention-days: 14

  real-app-e2e:
    name: Real application end to end (local Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start the local Supabase stack (Docker on loopback; the CLI applies supabase/migrations to a throwaway database)
        id: stack_start
        run: supabase start -x studio,imgproxy,logflare,vector

      - name: Record who holds the local Supabase ports and which containers exist when the stack did not start (read-only; kills nothing)
        if: failure() && steps.stack_start.outcome == 'failure'
        run: |
          echo "--- sockets on the Supabase local ports (54320-54339), with their owning process"
          sudo ss -tanp 2>/dev/null | grep -E ':543[2-3][0-9]\b' || echo "none"
          echo "--- ephemeral port range"
          cat /proc/sys/net/ipv4/ip_local_port_range
          echo "--- containers (name, status, ports)"
          docker ps -a --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' || true

      - name: IPSAS accrual preparation journey, AUTHENTICATED (the same stack; real Auth sign-in for owner, preparer, partner, a viewer member and an outsider, real PostgREST, RLS and private Storage, no simulated identity or bridge; PPE and grants driven through their normal page - save and reopen, stale revision, concurrent writer, dropped response retried with the original request identity, reviewer confirmation; direct calls with real JWTs prove server enforcement, cross-company refusal and revoked access; 1280 and 375 px)
        if: always()
        run: node scripts/e2e/ipsasAuthJourney.mjs real-app-evidence/ipsas

      - name: Keep the local Edge Functions log with the IPSAS evidence when that journey fails
        if: failure()
        run: docker ps --format '{{.Names}}' | grep edge_runtime | head -1 | xargs -r docker logs > real-app-evidence/ipsas/edge-runtime.log 2>&1

      - name: Upload authenticated IPSAS evidence immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipsas-auth-evidence-${{ github.sha }}
          path: real-app-evidence/ipsas
          if-no-files-found: ignore

      - name: Real application journey (the production build on loopback in headless Chrome; real Auth, PostgREST, RLS, Storage and Edge Functions; sign-in, first run, non-calendar periods, upload and review, next actions, Close Review, comparatives, adjustments, evidence, sign-off, sealed export, stale result, two-account isolation, 1280 and 375 px)
        if: always()
        run: node scripts/e2e/localStackJourney.mjs real-app-evidence

      - name: Keep the local Edge Functions log with the evidence when the journey fails
        if: failure()
        run: docker ps --format '{{.Names}}' | grep edge_runtime | head -1 | xargs -r docker logs > real-app-evidence/edge-runtime.log 2>&1

      - name: Workload measurement through the real stack (representative 18-account journey to FINAL with the official pack issued, verified and retrieved; a 30-version history; 8 simultaneous saves; a demanding 2,000-account trial balance with a 20,000-row ledger - client-observed API round trips recorded in real-app-evidence/workload/measurements.json, never CPU)
        if: always()
        run: bun scripts/e2e/workloadJourney.mjs real-app-evidence/workload

      - name: Trial balance drafts journey (the same stack; real Auth, PostgREST, RLS, Storage and the trial-balance-draft function served from this repository; reserve, signed upload, commit with server copy and SHA-256 verification, lost responses, interruptions resumed, revoked authority, integrity refusal, retention sweeps deleting real objects, committed evidence intact)
        if: always()
        run: bun scripts/e2e/draftJourney.mjs real-app-evidence/drafts

      - name: Keep the local Edge Functions log with the drafts evidence when that journey fails
        if: failure()
        run: docker ps --format '{{.Names}}' | grep edge_runtime | head -1 | xargs -r docker logs > real-app-evidence/drafts/edge-runtime.log 2>&1

      - name: Finding correction journey (the production build in headless Chrome on the same stack; a cost-of-sales account saved as Revenue raises a Close Review finding, which opens that account on the trial balance page; a refused save and a save whose answer is cut by the browser, retried with the same request id - exactly one decision recorded; the confirmed new check and the findings checked again; Back, reload, a viewer read-only, another account refused; the uploaded object, earlier decisions and the earlier findings run preserved; 1280 and 375 px)
        if: always()
        run: node scripts/e2e/findingCorrectionJourney.mjs real-app-evidence/finding-correction

      - name: Processing resource evidence (always; the runtime version and its own CPU-limit and worker-retirement lines with each admitted check's worker, number in that worker, status, wall and CPU time; read-only)
        if: always()
        run: |
          supabase --version || true
          EDGE=$(docker ps --format '{{.Names}}' | grep edge_runtime | head -1)
          docker inspect --format '{{.Config.Image}}' "$EDGE" || true
          mkdir -p real-app-evidence/drafts
          docker logs "$EDGE" > real-app-evidence/drafts/edge-runtime-always.log 2>&1 || true
          grep -E "Using supabase-edge-runtime|\[PTB\] worker=|\[PTB\] Ingested|CPU time (soft|hard) limit|early termination|WorkerRequestCancelled|Detected file" real-app-evidence/drafts/edge-runtime-always.log | grep -v "Detected file: mto-" || true

      - name: Original file retrieval journey (the same stack; real Auth and the application's own upload sequence into the private bucket; the owner and a collaborator the owner granted are served a signed URL for exactly their upload, byte for byte against the recorded SHA-256; a person with no right, another company's owner, injected fields, anon and direct bucket reads are all refused; a revoked collaborator is refused on the next request; a missing object is reported as unavailable; an issued URL is allowed to expire)
        if: always()
        run: node scripts/e2e/sourceDownloadJourney.mjs real-app-evidence/source-download

      - name: Keep the local Edge Functions log with the retrieval evidence when that journey fails
        if: failure()
        run: docker ps --format '{{.Names}}' | grep edge_runtime | head -1 | xargs -r docker logs > real-app-evidence/source-download/edge-runtime.log 2>&1

      - name: Online payment journey (the same stack; the payment functions served from this repository with generated test configuration; Polar and Snippe replaced by a loopback MOCK; admin opens sandbox payments and approves prices, card and mobile-money purchases, signed webhooks with replay, bad signature, stale timestamp, unknown checkout and 5 concurrent deliveries, expiry and a new attempt, refund review, manual activation and the paid-term guard, cross-account denial, 1280 and 375 px)
        if: always()
        run: node scripts/e2e/paymentJourney.mjs real-app-evidence/payments

      - name: Launch-acceptance identity (evidence branch only; proves the tree actually checked out and built equals the candidate under test apart from the QA files, and records the harness commit separately)
        if: always()
        env:
          LAUNCH_QA_CANDIDATE_SHA: ebafa68d06a13d5936a48e2020b8594fd5546daa
        run: |
          set -u
          OUT=real-app-evidence/launch-qa; mkdir -p "$OUT"
          git fetch --no-tags --depth=1 origin "$LAUNCH_QA_CANDIDATE_SHA" >/dev/null 2>&1 || true
          BUILT=$(git rev-parse HEAD)
          CHANGED=$(git diff --name-only "$LAUNCH_QA_CANDIDATE_SHA" HEAD 2>/dev/null || echo "__candidate_unavailable__")
          OUTSIDE=$(printf '%s\n' "$CHANGED" | grep -v -E '^(research/launch-qa/|\.github/workflows/ci\.yml$)' | grep -v '^$' || true)
          DIRTY=$(git diff --name-only HEAD)
          VERIFIED=false; [ -z "$OUTSIDE" ] && [ -z "$DIRTY" ] && VERIFIED=true
          APPTREE=$(git rev-parse "$LAUNCH_QA_CANDIDATE_SHA^{tree}" 2>/dev/null || echo unknown)
          node -e 'const [o,c,b,t,v,ch,out,d]=process.argv.slice(1); require("fs").writeFileSync(o+"/identity.json", JSON.stringify({applicationSha:c, applicationTree:t, builtCommit:b, verified:v==="true", filesDifferingFromCandidate:ch.split("\n").filter(Boolean), outsideAllowedQaFiles:out.split("\n").filter(Boolean), trackedModificationsBeforeBuild:d.split("\n").filter(Boolean)}, null, 2))' "$OUT" "$LAUNCH_QA_CANDIDATE_SHA" "$BUILT" "$APPTREE" "$VERIFIED" "$CHANGED" "$OUTSIDE" "$DIRTY"
          cat "$OUT/identity.json"
          [ "$VERIFIED" = true ]

