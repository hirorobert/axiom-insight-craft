name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual runs only: the write-capable staging RLS regression is reachable ONLY through this trigger.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request whose head must equal the tested commit (browser acceptance fails otherwise)"
        required: false
        type: string

jobs:
  migration-audit:
    name: Supabase Migration Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run migration auditor (strict)
        run: |
          set -o pipefail
          node scripts/audit_migrations.mjs --strict | tee audit.log
          if ! grep -q '^VERDICT: CLEAN$' audit.log; then
            echo "::error::Migration audit did not report CLEAN."
            exit 1
          fi

  conflict-marker-check:
    name: Merge Conflict Marker Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for merge conflict markers
        run: |
          set -e
          # Search tracked files for conflict markers. Exclude this workflow file itself.
          # Patterns anchored at line start to avoid false positives in prose.
          if git grep -n -I -E '^(<{7}|={7}|>{7})( |$)' -- ':!.github/workflows/ci.yml'; then
            echo "::error::Merge conflict markers detected. Resolve before merging."
            exit 1
          fi
          echo "No merge conflict markers found."

  lint-build-and-typecheck:
    name: Lint, Build and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Type check
        run: bunx tsc --noEmit -p tsconfig.app.json

  release-gate:
    name: Release Gate (clean Linux, frozen lockfile, full suite)
    runs-on: ubuntu-latest
    # The deterministic acceptance gate: exact head of the pull request, dependencies from the committed lockfile,
    # LF line endings (.gitattributes), zero failing tests — there is no "baseline failure" allowance.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # bun.lock is the ONLY lockfile (packageManager: bun@1.3.14 in package.json); scripts/ci/assertSingleLockfile.mjs guards it.
      - name: Install dependencies from the committed lockfile (frozen)
        run: bun install --frozen-lockfile

      - name: Jurisdiction audits (copy audit + import boundary)
        run: bunx vitest run src/lib/jurisdiction

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Package-manager authority (one lockfile, pinned Bun, no competing installer)
        run: node scripts/ci/assertSingleLockfile.mjs

      - name: Migration authority (the hosted Drizzle apply journal mirrors the authored supabase/migrations exactly)
        run: node scripts/ci/assertMigrationAuthority.mjs

      - name: Full test suite
        run: bun run test

      - name: Build
        run: bun run build

      - name: Jurisdiction pack isolation (the pack is a separate lazy chunk; entry chunks carry no statutory wording)
        run: node scripts/ci/assertPackIsolation.mjs dist

  golden-tests:
    name: Golden Fixture Tests (vitest)
    runs-on: ubuntu-latest
    # Run in parallel with lint-build — tests don't depend on build output
    needs: []

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run golden fixture tests
        run: bun run test
        # Tests cover: computeComplianceScore (pure scoring engine, all grade boundaries,
        # 5 factors, 6 FA2026 fixtures) + computeWearTear (ITA s.34 all 7 classes).
        # These are pure-function tests — no DB, no network, no mocks except supabase client.

  rls-regression:
    name: Staging RLS Regression (manual, write-capable)
    # WRITE-CAPABLE: this suite creates users, companies and rows in the Supabase project it
    # targets. It must never run automatically, so it is reachable ONLY through a manual
    # workflow_dispatch, never from pull_request or push.
    #
    # It also requires the protected `staging` GitHub environment. Configure that environment
    # (repository settings) with: required reviewers, deployment branches limited to `main`, the
    # secrets STAGING_SUPABASE_URL / STAGING_SUPABASE_ANON_KEY / STAGING_SUPABASE_SERVICE_ROLE_KEY,
    # and the variable STAGING_SUPABASE_PROJECT_REF (the explicit expected staging project
    # reference). Until that variable exists the guard below fails closed and nothing runs.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    concurrency:
      group: rls-regression-staging
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Fail-closed guard. Runs BEFORE dependencies are installed and before any client exists.
      # Secrets are scoped to the steps that need them (never job-level) and are never printed.
      - name: Verify the target is the expected staging project (never production)
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/stagingGuard.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run RLS regression suite against staging
        # The suite re-runs the same guard itself before creating any client.
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: bun run test:rls

      - name: Upload lifecycle proof against staging (PR #32: real Auth, PostgREST, RLS and Storage)
        # Same guard, same STAGING_* variables only; refuses production by construction.
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/upload_lifecycle_staging.mjs

      - name: Source sweeper readiness on staging (PR #32; fail-closed)
        # Same guard, same STAGING_* variables only. NOT READY unless deployed, configured for this project,
        # scheduled and answering a single-use ticket (the lifecycle proof above configures the staging URL).
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/sweeper_readiness.mjs

      - name: Staging browser acceptance (PR #32; real frontend, headless Chrome, disposable identities)
        # Same guard, same STAGING_* variables only. Builds the frontend with NO .env readable and verifies the bundle
        # names staging and never production; fails on any failed journey, any production request, a forbidden stage,
        # a cleanup failure, missing screenshots, or a tested commit that is not the requested PR head.
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ARTIFACT_DIR: artifacts/browser-acceptance
        run: node scripts/browser_acceptance.mjs

      - name: Upload browser acceptance screenshots for human review
        # Runs after a failed suite too (never after a cancel), so failures can be reviewed. No secrets, no env; it
        # uploads only the screenshots, results.json and cleanup.json the suite wrote. The job still fails.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-${{ github.sha }}
          path: artifacts/browser-acceptance
          if-no-files-found: error
          retention-days: 14

  db-contract-tests:
    name: Disposable-DB Contract Tests (Ω∞ A+ closure)
    runs-on: ubuntu-latest
    # Never touches Supabase staging/production. Applies the FULL real
    # migration chain to a throwaway postgres:16 service container that
    # exists only for this job's lifetime, then exercises the Ω3-CHECKOUT
    # acquisition/CAS/platform-matrix contract with real concurrent
    # sessions — see scripts/db-contract-tests/ for the full harness.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract_test_main
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: contract_test_main

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure postgresql-client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Run disposable-DB contract test harness
        run: bash scripts/db-contract-tests/run.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Financial-statements persistence proof (fresh database on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/fs_proof
        run: |
          createdb fs_proof
          bun add --no-save --ignore-scripts pg@8
          node scripts/db-proof/run.mjs

      - name: Workspace setup authority proof (25-way concurrency, role/RLS matrix, on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/setup_proof
        run: |
          createdb setup_proof
          node scripts/db-proof/setupAuthority.mjs

      - name: Service enquiry intake proof (no direct table access, idempotency, 100-pair transition matrix, concurrency, outbox, on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/enquiry_proof
        run: |
          createdb enquiry_proof
          node scripts/db-proof/serviceEnquiries.mjs

      - name: Trial balance upload lifecycle proof (legacy-data upgrade, certification-driven transitions, cancel/restore, capability matrix, concurrency, on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/lifecycle_proof
        run: |
          createdb lifecycle_proof
          node scripts/db-proof/uploadLifecycle.mjs

      - name: CFO Close entitlements proof (legacy upgrade, catalogue, paid-action authority, walls, entity capacity, concurrency, on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/entitlements_proof
        run: |
          createdb entitlements_proof
          node scripts/db-proof/entitlements.mjs

      - name: Named-user billing suspension, invitation reservations and official Reporting Pack proof (on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/billing_suspension_proof
        run: |
          createdb billing_suspension_proof
          node scripts/db-proof/billingSuspension.mjs
