name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Manual runs only: the write-capable staging RLS regression is reachable ONLY through this trigger.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request whose head must equal the tested commit (browser acceptance fails otherwise)"
        required: false
        type: string

jobs:
  migration-audit:
    name: Supabase Migration Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run migration auditor (strict)
        run: |
          set -o pipefail
          node scripts/audit_migrations.mjs --strict | tee audit.log
          if ! grep -q '^VERDICT: CLEAN$' audit.log; then
            echo "::error::Migration audit did not report CLEAN."
            exit 1
          fi

  conflict-marker-check:
    name: Merge Conflict Marker Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for merge conflict markers
        run: |
          set -e
          # Search tracked files for conflict markers. Exclude this workflow file itself.
          # Patterns anchored at line start to avoid false positives in prose.
          if git grep -n -I -E '^(<{7}|={7}|>{7})( |$)' -- ':!.github/workflows/ci.yml'; then
            echo "::error::Merge conflict markers detected. Resolve before merging."
            exit 1
          fi
          echo "No merge conflict markers found."

  lint-build-and-typecheck:
    name: Lint, Build and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Type check
        run: bunx tsc --noEmit -p tsconfig.app.json

  release-gate:
    name: Release Gate (clean Linux, frozen lockfile, full suite)
    runs-on: ubuntu-latest
    # The deterministic acceptance gate: exact head of the pull request, dependencies from the committed lockfile,
    # LF line endings (.gitattributes), zero failing tests — there is no "baseline failure" allowance.
    # The database-inertness guard compares HEAD against GitHub's exact base, never an assumed branch
    # (scripts/ci/inertBase.mjs): the pull request's base SHA, or the push's "before" SHA. It fails closed without one.
    env:
      DB_INERT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
      DB_INERT_BASE_SOURCE: ${{ github.event_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # bun.lock is the ONLY lockfile (packageManager: bun@1.3.14 in package.json); scripts/ci/assertSingleLockfile.mjs guards it.
      - name: Install dependencies from the committed lockfile (frozen)
        run: bun install --frozen-lockfile

      - name: Jurisdiction audits (copy audit + import boundary)
        run: bunx vitest run src/lib/jurisdiction

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Package-manager authority (one lockfile, pinned Bun, no competing installer)
        run: node scripts/ci/assertSingleLockfile.mjs

      - name: Migration authority (the hosted Drizzle apply journal mirrors the authored supabase/migrations exactly)
        run: node scripts/ci/assertMigrationAuthority.mjs

      - name: Database-inertness guard against the exact base (must execute with zero skipped)
        run: |
          bunx vitest run src/lib/financialStatementsWorkspace/databaseInert.test.ts src/lib/__tests__/inertBase.test.ts --reporter=verbose --reporter=json --outputFile.json=inert-report.json
          node scripts/ci/assertTestsExecuted.mjs inert-report.json src/lib/financialStatementsWorkspace/databaseInert.test.ts src/lib/__tests__/inertBase.test.ts

      - name: Full test suite
        run: bun run test

      - name: Build
        run: bun run build

      - name: Jurisdiction pack isolation (the pack is a separate lazy chunk; entry chunks carry no statutory wording)
        run: node scripts/ci/assertPackIsolation.mjs dist

      - name: Public search identity (the production build's icons, social image, manifest, per-route canonicals and sitemap on https://cfoclose.com)
        run: node scripts/ci/assertPublicMetadata.mjs dist

      - name: Public search identity in the browser (the production build served on loopback; each route's title, single canonical on https://cfoclose.com, robots, in headless Chrome)
        run: node scripts/ci/routeMetadataInBrowser.mjs dist

      - name: Production bundle isolation (the bundle guard re-run against the build; the full suite above runs before dist exists, where it skips)
        run: bunx vitest run src/lib/financialStatementsWorkspace/harnessIsolation.test.ts
      - name: Development gallery excluded from the production bundle
        run: node scripts/ci/assertDevGalleryExcluded.mjs dist

  edge-function-checks:
    name: Edge function checks (Deno, process-trial-balance)
    runs-on: ubuntu-latest
    # Read-only: type-checks the trial-balance ingestion core and runs the REAL process-trial-balance handler end to end
    # with only its network edges (Supabase client, std serve) replaced by in-memory doubles. No secrets, no deploy.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Type-check the complete process-trial-balance function against the real Supabase client types
        run: deno check supabase/functions/process-trial-balance/index.ts

      - name: Type-check the complete trial-balance-layout function (authentication imports included) against the real Supabase client types
        run: deno check supabase/functions/trial-balance-layout/index.ts

      - name: Type-check the complete layout-assist function (I1-C; no provider wired) against the real Supabase client types
        run: deno check supabase/functions/layout-assist/index.ts

      - name: Type-check the ingestion core and the function-path test
        run: deno check --import-map=supabase/functions/process-trial-balance/functionpath/import_map.json supabase/functions/_shared/tbIngestion.ts supabase/functions/_shared/tbSource.ts supabase/functions/_shared/layoutProfile.ts supabase/functions/process-trial-balance/functionpath/functionPath.test.ts

      - name: Function-path tests (real handler, in-memory database double)
        run: deno test --no-check --allow-env --allow-net=esm.sh,deno.land --import-map=supabase/functions/process-trial-balance/functionpath/import_map.json supabase/functions/process-trial-balance/functionpath/functionPath.test.ts

      - name: Existing process-trial-balance Deno tests
        run: deno test --allow-env --allow-read --allow-net=esm.sh,deno.land supabase/functions/process-trial-balance/balanceSheetCheck_test.ts supabase/functions/process-trial-balance/l5l6Evidence.test.ts supabase/functions/process-trial-balance/normalize.test.ts supabase/functions/process-trial-balance/publicSectorClassification_test.ts supabase/functions/process-trial-balance/requestIdentity.test.ts supabase/functions/process-trial-balance/tierProvenance.test.ts

  golden-tests:
    name: Golden Fixture Tests (vitest)
    runs-on: ubuntu-latest
    # Run in parallel with lint-build — tests don't depend on build output
    needs: []
    # The database-inertness guard compares HEAD against GitHub's exact base, never an assumed branch
    # (scripts/ci/inertBase.mjs): the pull request's base SHA, or the push's "before" SHA. It fails closed without one.
    env:
      DB_INERT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
      DB_INERT_BASE_SOURCE: ${{ github.event_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Database-inertness guard against the exact base (must execute with zero skipped)
        run: |
          bunx vitest run src/lib/financialStatementsWorkspace/databaseInert.test.ts src/lib/__tests__/inertBase.test.ts --reporter=verbose --reporter=json --outputFile.json=inert-report.json
          node scripts/ci/assertTestsExecuted.mjs inert-report.json src/lib/financialStatementsWorkspace/databaseInert.test.ts src/lib/__tests__/inertBase.test.ts

      - name: Run golden fixture tests
        run: bun run test
        # Tests cover: computeComplianceScore (pure scoring engine, all grade boundaries,
        # 5 factors, 6 FA2026 fixtures) + computeWearTear (ITA s.34 all 7 classes).
        # These are pure-function tests — no DB, no network, no mocks except supabase client.

  reconciliation-function-checks:
    name: Edge function checks (Deno, reconciliation result and resolution)
    runs-on: ubuntu-latest
    # Read-only: type-checks the two reconciliation functions that record results through the service-role RPCs. No secrets, no deploy.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Type-check safisha-match, safisha-resolve and safisha-ingest against the real Supabase client types
        run: deno check supabase/functions/safisha-match/index.ts supabase/functions/safisha-resolve/index.ts supabase/functions/safisha-ingest/index.ts

  rls-regression:
    name: Staging RLS Regression (manual, write-capable)
    # WRITE-CAPABLE: this suite creates users, companies and rows in the Supabase project it
    # targets. It must never run automatically, so it is reachable ONLY through a manual
    # workflow_dispatch, never from pull_request or push.
    #
    # It also requires the protected `staging` GitHub environment. Configure that environment
    # (repository settings) with: required reviewers, deployment branches limited to `main`, the
    # secrets STAGING_SUPABASE_URL / STAGING_SUPABASE_ANON_KEY / STAGING_SUPABASE_SERVICE_ROLE_KEY,
    # and the variable STAGING_SUPABASE_PROJECT_REF (the explicit expected staging project
    # reference). Until that variable exists the guard below fails closed and nothing runs.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 45
    concurrency:
      group: rls-regression-staging
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Fail-closed guard. Runs BEFORE dependencies are installed and before any client exists.
      # Secrets are scoped to the steps that need them (never job-level) and are never printed.
      - name: Verify the target is the expected staging project (never production)
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/ci/stagingGuard.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run RLS regression suite against staging
        # The suite re-runs the same guard itself before creating any client.
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: bun run test:rls

      - name: Upload lifecycle proof against staging (PR #32: real Auth, PostgREST, RLS and Storage)
        # Same guard, same STAGING_* variables only; refuses production by construction.
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/upload_lifecycle_staging.mjs

      - name: Source sweeper readiness on staging (PR #32; fail-closed)
        # Same guard, same STAGING_* variables only. NOT READY unless deployed, configured for this project,
        # scheduled and answering a single-use ticket (the lifecycle proof above configures the staging URL).
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
        run: node scripts/sweeper_readiness.mjs

      - name: Staging browser acceptance (PR #32; real frontend, headless Chrome, disposable identities)
        # Same guard, same STAGING_* variables only. Builds the frontend with NO .env readable and verifies the bundle
        # names staging and never production; fails on any failed journey, any production request, a forbidden stage,
        # a cleanup failure, missing screenshots, or a tested commit that is not the requested PR head.
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ARTIFACT_DIR: artifacts/browser-acceptance
        run: node scripts/browser_acceptance.mjs

      - name: Upload browser acceptance screenshots for human review
        # Runs after a failed suite too (never after a cancel), so failures can be reviewed. No secrets, no env; it
        # uploads only the screenshots, results.json and cleanup.json the suite wrote. The job still fails.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance-${{ github.sha }}
          path: artifacts/browser-acceptance
          if-no-files-found: error
          retention-days: 14

  real-app-e2e:
    name: Real application end to end (local Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start the local Supabase stack (Docker on loopback; the CLI applies supabase/migrations to a throwaway database)
        run: supabase start -x studio,imgproxy,logflare,vector

      - name: Real application journey (the production build on loopback in headless Chrome; real Auth, PostgREST, RLS, Storage and Edge Functions; sign-in, first run, non-calendar periods, upload and review, next actions, Close Review, comparatives, adjustments, evidence, sign-off, sealed export, stale result, two-account isolation, 1280 and 375 px)
        run: node scripts/e2e/localStackJourney.mjs real-app-evidence

      - name: Keep the local Edge Functions log with the evidence when the journey fails
        if: failure()
        run: docker ps --format '{{.Names}}' | grep edge_runtime | head -1 | xargs -r docker logs > real-app-evidence/edge-runtime.log 2>&1

      - name: Upload the real application evidence (screenshots, journey log, results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-app-evidence
          path: real-app-evidence
          if-no-files-found: ignore

      - name: Stop the local stack
        if: always()
        run: supabase stop --no-backup

  db-contract-tests:
    name: Disposable-DB Contract Tests (Ω∞ A+ closure)
    runs-on: ubuntu-latest
    # Never touches Supabase staging/production. Applies the FULL real
    # migration chain to a throwaway postgres:16 service container that
    # exists only for this job's lifetime, then exercises the Ω3-CHECKOUT
    # acquisition/CAS/platform-matrix contract with real concurrent
    # sessions — see scripts/db-contract-tests/ for the full harness.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract_test_main
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: contract_test_main

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure postgresql-client is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Run disposable-DB contract test harness
        run: bash scripts/db-contract-tests/run.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Financial-statements persistence proof (fresh database on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/fs_proof
        run: |
          createdb fs_proof
          bun add --no-save --ignore-scripts pg@8
          node scripts/db-proof/run.mjs

      - name: Workspace setup authority proof (25-way concurrency, role/RLS matrix, on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/setup_proof
        run: |
          createdb setup_proof
          node scripts/db-proof/setupAuthority.mjs

      - name: Service enquiry intake proof (no direct table access, idempotency, 100-pair transition matrix, concurrency, outbox, on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/enquiry_proof
        run: |
          createdb enquiry_proof
          node scripts/db-proof/serviceEnquiries.mjs

      - name: Trial balance upload lifecycle proof (legacy-data upgrade, certification-driven transitions, cancel/restore, capability matrix, concurrency, on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/lifecycle_proof
        run: |
          createdb lifecycle_proof
          node scripts/db-proof/uploadLifecycle.mjs

      - name: Mapping and processing authority proof (S1 — mapping writes and provenance, review combinations, server-owned processing fields, reprocess requests, certification invalidation, on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/s1_proof
        run: |
          createdb s1_proof
          bun scripts/db-proof/mappingProcessingAuthority.mjs

      - name: H2/E1 real-handler characterization (the current process-trial-balance handler on real PostgreSQL must meet every requirement and equal the independent oracle on every defect fixture; the previous engine, at the ledger's commit, must reproduce each registered defect exactly; an injected equation fault must fail the run with nothing certified; any other outcome or infrastructure error fails; on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/h2_proof
        run: |
          createdb h2_proof
          git fetch --no-tags --depth=1 origin "$(node -p "require('./scripts/db-proof/fixtures/h2-known-defects.json').engine_commit")"
          git fetch --no-tags --depth=1 origin "$(node -p "require('./scripts/db-proof/fixtures/h2-known-defects.json').e1_engine_commit")"
          bun scripts/db-proof/tbHandlerCharacterization.mjs

      - name: H1 treatment authority and processing control proof (admin-only versioned control, database-enforced hold for every role, drain bound, numeric generation floor, the real handler refused while held and below the floor, treatment request identity TS = SQL, confirmation binding/replay/conflict/expiry; on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/h1_proof
        run: |
          createdb h1_proof
          git fetch --no-tags --depth=1 origin "$(node -p "require('./scripts/db-proof/fixtures/h2-known-defects.json').engine_commit")"
          git fetch --no-tags --depth=1 origin "$(node -p "require('./scripts/db-proof/fixtures/h2-known-defects.json').e1_engine_commit")"
          bun scripts/db-proof/h1Authority.mjs

      - name: S2 attempt authority proof (upgrade with rollback and OD1, the fence for every role, begin/replay/conflict/in-progress and every refusal, dependency staleness at finalize and at read time, preemption and lifecycle abandonment, lease expiry and the drain, fault injection at every finalize statement, pg_stat_activity barriers, lock pairs with deadlock controls, the prior contracts of the re-created functions; on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/s2_proof
        run: |
          createdb s2_proof
          bun scripts/db-proof/s2Authority.mjs

      - name: I1-A periods and currency proof (migration preflight refusals, currency registry, explicit and non-calendar periods, year identity, adjacent prior, prepare_close matrix and reviewer-only scope, 25-way concurrency through the RPC and the exclusion constraint alone, the client-write fence, the processing lock for every role, audited legacy date completion with invalidation, date confirmation, v1 compatibility, append-only history; on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/periods_proof
        run: |
          createdb periods_proof
          node scripts/db-proof/periodsAuthority.mjs

      - name: I1-A layout proof (real trial-balance-layout and process-trial-balance handlers; templates versioned without file identity, confirmations bound to source and resolved-layout hashes with every row's disposition, append-only, expected versions, 10-way concurrency, reuse re-validation, the layout dependency, generation-3/generation-4 and schema compatibility; on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/layout_proof
        run: |
          createdb layout_proof
          git fetch --no-tags --depth=1 origin 553d54cac9921cfc7b2698842bd4fff2a6be8f1b
          bun scripts/db-proof/layoutAuthority.mjs

      - name: I1-B shared-source proof (one file registered as current and prior year sharing one managed source object; adjacency, workspace, actor, expiry, storage and active-slot refusals write nothing; a failure injected at every write step leaves nothing and the reservation reusable; 12-way idempotent retry; server-only immutable link; the file kept while either year references it and deleted exactly once by the real sweeper, also after concurrent discards and racing sweeps; on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/shared_source_proof
        run: |
          createdb shared_source_proof
          bun scripts/db-proof/sharedSourceAuthority.mjs

      - name: I1-C layout-assist controls proof (the real layout-assist function refuses before any read while no provider is wired; provider disabled with both approval gates required; versioned, revocable, append-only workspace consent by manage_members; daily quota and monthly cost cap reserved pessimistically under 12-way concurrency; idempotent runs completed once; a test provider injected into the real function sees only the minimized sample, the suggestion is validated against the whole file and confirmed only through the existing layout function; on the same throwaway container)
        env:
          DB_PROOF_MODE: external
          DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/layout_assist_proof
        run: |
