name: owner-access-proof
on:
  push:
    branches: [feature/owner-access-entity-limits-20261015]
  workflow_dispatch:

jobs:
  proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: owner_access_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_PROOF_CONN: postgres://postgres:postgres@127.0.0.1:5432/owner_access_proof
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: PROOF — full migration-chain replay + platform-owner/access/entity-allowance (§16)
        run: bun scripts/db-proof/owner_access_proof.mjs
