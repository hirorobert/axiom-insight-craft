project_id = "bvyivmmfjejbmqoydezk"

[functions]
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.generate-disclosure-notes]
    verify_jwt = false
  # The canonical Comparative Assurance endpoint and its legacy-named compatibility adapter serve the same handler
  # (supabase/functions/_shared/comparativeAssurance.ts), which authenticates the caller's JWT itself.
  [functions.comparative-assurance-engine]
    verify_jwt = false
  [functions.kinga-comparative-engine]
    verify_jwt = false
  [functions.policy-compass]
    verify_jwt = false
  [functions.process-trial-balance]
    verify_jwt = false
  # Intuit redirects the BROWSER here after the person approves the connection: the request carries no Supabase token, so the single-use state
  # (consumed first, bound to the workspace and the person, valid at most 30 minutes) is the only credential. It exchanges nothing: it parks the sealed
  # code and hands the browser a one-time handoff code.
  [functions.qbo-oauth-callback]
    verify_jwt = false
  # Finishes the connection for the SIGNED-IN person who started it (review r2, S4): the caller MUST be authenticated.
  [functions.qbo-finish-connection]
    verify_jwt = true
  # Explicit release configuration: these endpoints also authenticate inside their handlers.
  [functions.qbo-connect-start]
    verify_jwt = true
  [functions.qbo-pull-trial-balance]
    verify_jwt = true
  [functions.qbo-disconnect]
    verify_jwt = true
  # Called by the database (pg_cron + pg_net) with a single-use, database-minted ticket; the ticket is the credential.
  [functions.trial-balance-source-sweeper]
    verify_jwt = false
  # Payment provider deliveries: the provider's signature over the raw body is the credential (no Supabase JWT exists).
  [functions.commercial-webhook-polar]
    verify_jwt = false
  [functions.commercial-webhook-snippe]
    verify_jwt = false
  # Recent-reauthentication gate for privileged access-administration actions: the caller MUST be authenticated.
  [functions.reauthenticate]
    verify_jwt = true
